<div class="row animated fadeIn">
    <div class="col-12 col-md-5 col-xl-4 pl-0 pl-md-3 pr-0 pr-md-3" style="max-width: 460px; min-width: 150px;">
        <div class="card">
            <div class="card-header ">
                <ul class="nav nav-pills card-header-pills float-right">
                    <li class="nav-item">
                        <button class="btn btn-danger" (click)="openModal(null)"><i class="fa fa-plus"></i></button>
                    </li>

                    <li class="nav-item ml-2">
                        <button class="btn btn-danger" (click)="fileUpload.click()">Upload</button>
                    </li>

                    <li class="nav-item ml-2">
                        <button class="btn btn-danger" (click)="fileUploadprev.click()">Vorschau</button>
                    </li>

                    <input type="file" class="file-input" (change)="onFileSelected($event, false)" #fileUpload>
                    <input type="file" class="file-input" (change)="onFileSelected($event, true)" #fileUploadprev>

                </ul>
            </div>
            <div class="card-body ">
                <div class="col-12 col-md-5" style="max-width: 460px;">
                    <form class="form-horizontal" [formGroup]="SearchForm">
                        <div class="form-group row">
                            <div class="col-12">
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text samewidth">Barcode:</span>
                                    </div>

                                    <input type="text" autofocus class="form-control" formControlName="code"
                                        [ngClass]="{'is-invalid':submitted && f.code.errors}" />
                                </div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-12">
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text samewidth">Name:</span>
                                    </div>
                                    <input type="text" class="form-control" formControlName="search"
                                        [ngClass]="{'is-invalid':submitted && f.search.errors}" />
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row animated fadeIn">

    <div *ngIf="isLoading">Loading...</div>

    <div class="col-12 col-md-4 col-xl-3 pl-0 pl-md-3 pr-0 pr-md-3" *ngFor="let article of (Articles$ | async)">
        <div class="card">
            <div class="card-header ">
                <div style="float: left;"> {{article.name}}
                    <div> <small class="text-muted"> {{article.articleGroup.name}}</small></div>
                </div>

                <ul class="nav nav-pills card-header-pills float-right">
                    <li class="nav-item">
                        <button type="button" class="btn btn-primary" (click)="openModal(article)">
                            <i class="fa fa-edit"></i>
                        </button>
                    </li>
                </ul>
            </div>
            <div class="card-body ">

                <table style="width: 100%;">
                    <tbody>
                        <tr>
                            <td> {{article.type}}</td>
                            <td>{{article.supplier}}</td>
                        </tr>
                        <tr>
                            <td>{{article.artNumber}} </td>
                            <td>{{article.price | currency:"EUR"}}</td>
                        </tr>
                        <tr>
                            <td> {{article.code}} </td>
                            <td *ngIf="article.trackStock; else emptyStock">{{article.stock}} {{article.unit}}</td>
                            <ng-template #emptyStock></ng-template>
                        </tr>
                    </tbody>
                </table>

                <hr>

                <p class="card-text">{{article.description}}</p>
            </div>
        </div>

    </div>
</div>

<!--
  id: number;
  name: string;
  description: string;
  type: string;
  artNumber: string;
  code: string;
  supplier: string;
  imgPath: string;
  price: number;
  stock: number;

-->

        (closed)="onClose()"> </app-article-edit>
