<div class="animated fadeIn">
  <div class="card">
    <div class="card-header">Artikel Tabelle</div>
    <div class="card-body" style="padding:0;overflow-x:auto">
      <table class="table">
        <thead>
          <tr><th>Name</th><th>Typ</th><th>Barcode</th><th>Art.-Nummer</th><th>Bestand</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of articles">
            <td>{{ item.name }}</td>
            <td>{{ item.type }}</td>
            <td><code>{{ item.code }}</code></td>
            <td>{{ item.artNumber }}</td>
            <td [class.text-danger]="item.stock <= 0">{{ item.stock }} {{ item.unit }}</td>
          </tr>
          <tr *ngIf="!articles.length"><td colspan="5" class="empty">Keine Artikel.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
