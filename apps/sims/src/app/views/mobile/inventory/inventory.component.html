<div class="row animated fadeIn justify-content-center">
    <div class="col-12 col-md-5 pl-0 pl-md-3 pr-0 pr-md-3" style="max-width: 460px;">

        <div class="card" style="margin-bottom: 0rem;">

            <div class="card-header ">
                Inventur
            </div>
            <div class="card-body ">


                <form class="form-horizontal" [formGroup]="InputForm">

                    <div class="form-group row">
                        <div class="col-12">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text samewidth">Barcode:</span>
                                </div>

                                <input type="text" autofocus class="form-control" formControlName="code"
                                    [ngClass]="{'is-invalid':submitted && f.code.errors}" />
                            </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-12">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text samewidth">SOLL</span>
                                </div>
                                <input type="number" class="form-control" step="0.1" formControlName="should" 
                                    [ngClass]="{'is-invalid':submitted && f.should.errors}" />

                                    <div class="input-group-prepend">
                                        <span class="input-group-text samewidth">IST</span>
                                    </div>
                                    <input type="number" (click)="$event.target.select()" class="form-control" step="0.1" formControlName="is"
                                        [ngClass]="{'is-invalid':submitted && f.is.errors}" />
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-warning btn-lg btn-block mt-4" [disabled]="!Article" (click)="onSubmit()"> Inventur</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header ">
                Infos
            </div>
            <div class="card-body ">

                <div class="row">
                    <table class="table table-striped">
                        <tbody>
                            <tr>
                                <th class="fitwidth" scope="row">Name</th>
                                <td> {{Article?.name}}</td>
                            </tr>

                            <tr>
                                <th class="fitwidth" scope="row">Beschreibung</th>
                                <td> {{Article?.description}}</td>
                            </tr>

                            <tr>
                                <th class="fitwidth" scope="row">Lagerstand</th>
                                <td>{{Article?.stock}} {{Article?.unit}}</td>
                            </tr>

                            <tr>
                                <th class="fitwidth" scope="row">Artikel Nummer</th>
                                <td> {{Article?.artNumber}}</td>
                            </tr>

                            <tr>
                                <th class="fitwidth" scope="row">Typ</th>
                                <td>{{Article?.type}}</td>
                            </tr>


                            <tr>
                                <th class="fitwidth" scope="row">Hersteller</th>
                                <td>{{Article?.supplier}}</td>
                            </tr>

                            <tr>
                                <th class="fitwidth" scope="row">Barcode</th>
                                <td>{{Article?.code}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
