<div class="animated fadeIn" style="max-width:700px">
  <div class="card">
    <div class="card-header">Kundendaten</div>
    <div class="card-body">
      <form [formGroup]="CustomerForm">
        <div class="form-group"><label>Firma</label><input class="form-control" formControlName="companyName"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group"><label>Vorname</label><input class="form-control" formControlName="firstName"></div>
          <div class="form-group"><label>Nachname</label><input class="form-control" formControlName="lastName"></div>
        </div>
        <div class="form-group"><label>Kunden-Nr.</label><input class="form-control" formControlName="customerNumber"></div>
        <div class="form-group"><label>Adresse</label><input class="form-control" formControlName="address"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group"><label>PLZ</label><input class="form-control" formControlName="postcode"></div>
          <div class="form-group"><label>Land</label><input class="form-control" formControlName="country"></div>
        </div>
        <div class="form-group"><label>Tel. privat</label><input class="form-control" formControlName="phonePrivate"></div>
        <div class="form-group"><label>Tel. geschäftlich</label><input class="form-control" formControlName="phoneCompany"></div>
        <div class="form-group"><label>E-Mail</label><input class="form-control" type="email" formControlName="email"></div>
        <div class="form-group"><label>UID</label><input class="form-control" formControlName="uid"></div>
        <div class="form-group">
          <label>Kundenrabatt %</label>
          <input class="form-control" type="number" formControlName="customerDiscount" style="max-width:140px">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="back()">Zurück</button>
      <button class="btn btn-primary" (click)="save()">Speichern</button>
    </div>
  </div>
</div>
