<app-header [navbarBrandRouterLink]="['/dashboard']" [fixed]="true"
  [navbarBrandFull]="{src: 'assets/img/brand/logo.svg', width: 89, height: 25, alt: 'CoreUI Logo'}"
  [navbarBrandMinimized]="{src: 'assets/img/brand/sygnet.svg', width: 30, height: 30, alt: 'CoreUI Logo'}"
  [sidebarToggler]="'lg'" [asideMenuToggler]="false" [mobileAsideMenuToggler]="false">

  <ul class="nav navbar-nav ml-auto">

    <li class="nav-item dropdown" dropdown placement="bottom right">
      <a class="nav-link" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false"
        dropdownToggle (click)="false">
        <i class="fa fa-shopping-cart" aria-hidden="true"></i>
        <span class="badge badge-primary">{{shoppingcart?.getAmountItems()}}</span>
      </a>

      <div class="dropdown-menu dropdown-menu-right media-mobile-full" *dropdownMenu aria-labelledby="simple-dropdown"
        style="min-width: 350px; max-width:100%;">
        <div class="dropdown-header text-center"><strong>{{shoppingcart?.customer.lastName}}
            {{shoppingcart?.customer.companyName}}</strong></div>

        <app-shoppingcart [(shoppingcart)]="shoppingcart"></app-shoppingcart>

        <div class="dropdown-header text-right d-flex align-items-center" *ngIf="shoppingcart">

          <a class="btn btn-info  ml-1 mr-3" style="margin-top: 0;" (click)="showPDF(shoppingcart.id)">
            <i class="fa fa-paper-plane-o"></i> PDF
          </a>

          <a class="btn btn-info mr-auto" style="margin-top: 0;" (click)="print(shoppingcart.id)" download>
            <i class="fa fa-print"></i> Drucken
          </a>

          <strong style="">
            <i class="fa fa-eur" style="margin: 0;"></i> {{shoppingcart?.getPrice()| number : '1.2-2'}}
          </strong>
        </div>

      </div>
    </li>
  </ul>
</app-header>
<div class="app-body">
  <app-sidebar #appSidebar [fixed]="true" [display]="'lg'" [minimized]="sidebarMinimized"
    (minimizedChange)="toggleMinimize($event)">
    <app-sidebar-nav [navItems]="navItems" [perfectScrollbar] [disabled]="appSidebar.minimized"></app-sidebar-nav>
    <app-sidebar-minimizer></app-sidebar-minimizer>
  </app-sidebar>
  <!-- Main content -->
