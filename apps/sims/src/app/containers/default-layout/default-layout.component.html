<div class="layout" [class.sidebar-closed]="!sidebarOpen">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">SIMS</span>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
    </div>
    <ul class="sidebar-nav">
      <ng-container *ngFor="let item of navItems">
        <li *ngIf="item.title" class="nav-title">{{ item.name }}</li>
        <li *ngIf="!item.title" class="nav-item">
          <a class="nav-link" [routerLink]="item.url" routerLinkActive="active">
            {{ item.name }}
          </a>
        </li>
      </ng-container>
    </ul>
  </nav>

  <!-- Main -->
  <div class="main-wrapper">
    <!-- Top bar -->
    <header class="topbar">
      <button class="topbar-toggle" (click)="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-spacer"></div>
      <!-- Cart button -->
      <button class="cart-btn" (click)="toggleCart()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="cart-badge" *ngIf="shoppingcart?.getAmountItems()">
          {{ shoppingcart?.getAmountItems() }}
        </span>
      </button>
    </header>

    <!-- Cart panel -->
    <div class="cart-panel" [class.open]="cartOpen">
      <div class="cart-panel-header">
        <span>Warenkorb</span>
        <button (click)="closeCart()">✕</button>
      </div>
      <div class="cart-panel-body" *ngIf="shoppingcart">
        <div class="cart-customer">{{ shoppingcart.customer?.lastName }} {{ shoppingcart.customer?.companyName }}</div>
        <app-shoppingcart [(shoppingcart)]="shoppingcart"></app-shoppingcart>
        <div class="cart-total">
          Gesamt: {{ shoppingcart.getPrice() | number:'1.2-2' }} €
        </div>
      </div>
      <div class="cart-panel-body" *ngIf="!shoppingcart">
        <p style="padding:1rem;color:var(--ink-3)">Kein aktiver Warenkorb.</p>
      </div>
    </div>
    <div class="cart-overlay" *ngIf="cartOpen" (click)="closeCart()"></div>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="page-footer">
      <span>Powered by <strong>abler.tirol</strong></span>
    </footer>
  </div>
</div>
