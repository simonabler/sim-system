<div class="sims-page-header">
  <div>
    <div class="eyebrow">Artikel</div>
    <h1 class="page-title">{{ isNew() ? 'Neuer Artikel' : 'Artikel bearbeiten' }}</h1>
  </div>
  <button class="btn-sims-ghost" (click)="back()">← Zurück</button>
</div>

@if (loading()) { <div class="sims-card skeleton" style="height:400px;"></div> }

@if (error()) {
  <div class="sims-card mb-3" style="color:var(--status-error); border-color:var(--status-error-border);">{{ error() }}</div>
}

@if (!loading()) {
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="sims-card mb-3">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="sims-label">Bezeichnung *</label>
          <input type="text" class="sims-input" formControlName="name" />
        </div>
        <div class="col-12 col-md-6">
          <label class="sims-label">Barcode *</label>
          <input type="text" class="sims-input" formControlName="code" />
        </div>
        <div class="col-12 col-md-6">
          <label class="sims-label">Artikel-Nr.</label>
          <input type="text" class="sims-input" formControlName="artNumber" />
        </div>
        <div class="col-12 col-md-6">
          <label class="sims-label">Lieferant *</label>
          <input type="text" class="sims-input" formControlName="supplier" />
        </div>
        <div class="col-12 col-md-6">
          <label class="sims-label">Typ *</label>
          <input type="text" class="sims-input" formControlName="type" />
        </div>
        <div class="col-6 col-md-3">
          <label class="sims-label">Preis *</label>
          <input type="number" class="sims-input" formControlName="price" inputmode="decimal" step="0.01" min="0" />
        </div>
        <div class="col-6 col-md-3">
          <label class="sims-label">Einheit *</label>
          <input type="text" class="sims-input" formControlName="unit" />
        </div>
        <div class="col-6 col-md-3">
          <label class="sims-label">Lagerstand</label>
          <input type="number" class="sims-input" formControlName="stock" inputmode="numeric" />
        </div>
        <div class="col-6 col-md-3">
          <label class="sims-label">Inventurdatum</label>
          <input type="date" class="sims-input" formControlName="inventoryDate" />
        </div>
        <div class="col-12 col-md-6">
          <label class="sims-label">Artikelgruppe</label>
          <select class="sims-select" formControlName="articleGroup">
            <option [value]="null">— keine —</option>
            @for (g of articleGroups(); track g.id) {
              <option [value]="g.id">{{ g.name }}</option>
            }
          </select>
        </div>
        <div class="col-12">
          <label class="sims-label">Beschreibung</label>
          <textarea class="sims-textarea" formControlName="description" rows="3"></textarea>
        </div>
        <div class="col-12">
          <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
              <input type="checkbox" formControlName="trackStock" /> Bestandsführung
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
              <input type="checkbox" formControlName="singlePos" /> Einzelposition
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
              <input type="checkbox" formControlName="noDiscount" /> Kein Rabatt
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="sticky-actions">
      <div class="row g-2">
        <div class="col-12 col-md-auto">
          <button type="submit" class="btn-sims-primary" [disabled]="saving()">
            {{ saving() ? 'Wird gespeichert…' : 'Speichern' }}
          </button>
        </div>
        @if (!isNew()) {
          <div class="col-12 col-md-auto">
            <button type="button" class="btn-sims-danger" (click)="delete()">Löschen</button>
          </div>
        }
      </div>
    </div>
  </form>
}
